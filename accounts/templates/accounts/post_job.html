{% extends "base.html" %}

{% block title %}Post Job{% endblock %}

{% block content %}
<div style="margin-bottom:20px;">

<a href="{% url 'dashboard' %}" style="
text-decoration:none;
color:white;
font-size:18px;
padding:8px 12px;
border-radius:8px;
background:rgba(255,255,255,0.1);
">

⬅ 

</a>

</div>

<style>

.container{
max-width:700px;
margin:auto;
padding:40px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
box-shadow:0 0 30px rgba(0,255,255,0.2);
color:white;
}

input, textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:20px;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.1);
color:white;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#06b6d4;
color:white;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#0891b2;
}

</style>


<div style="
min-height:100vh;
padding:40px;
background:linear-gradient(135deg,#1e1b4b,#312e81,#0f172a);
">

<div class="container">

<h1 style="color:#00f5ff;">📢 Post a New Job</h1>

<p style="opacity:0.8;margin-bottom:30px;">
Create a job and connect with talented freelancers
</p>

<form method="POST">

{% csrf_token %}

<label>Job Title</label>
<input type="text" name="title" placeholder="Example: Python Developer for Web Scraping" required>


<label>Job Description</label>
<textarea name="description" rows="5" placeholder="Explain what the freelancer needs to do..." required></textarea>


<label>Salary / Budget (₹)</label>
<input type="number" name="salary" placeholder="Example: 5000" required>


<label>Deadline</label>
<input type="date" name="deadline" required>


<button type="submit">
🚀 Post Job
</button>

</form>

</div>

</div>

{% endblock %}
