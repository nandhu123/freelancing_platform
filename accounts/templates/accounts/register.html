{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div style="
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #1f0036, #0f2027);
">

<div style="
    width:420px;
    padding:40px;
    border-radius:20px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(0,255,255,0.3);
    color:white;
">

<h2 style="text-align:center; margin-bottom:25px; color:#00f5ff;">Create Account</h2>

<form method="POST">
{% csrf_token %}

<input type="text" name="username" placeholder="Username" required
style="width:100%; padding:12px; margin-bottom:15px; border:none; border-radius:10px; background:rgba(255,255,255,0.1); color:white;">

<input type="email" name="email" placeholder="Email" required
style="width:100%; padding:12px; margin-bottom:15px; border:none; border-radius:10px; background:rgba(255,255,255,0.1); color:white;">

<input type="password" name="password" placeholder="Password" required
style="width:100%; padding:12px; margin-bottom:15px; border:none; border-radius:10px; background:rgba(255,255,255,0.1); color:white;">

<select name="role" required
style="width:100%; padding:12px; margin-bottom:25px; border:none; border-radius:10px; background:rgba(255,255,255,0.1); color:white;">
<option value="">Select Role</option>
<option value="client">Client</option>
<option value="freelancer">Freelancer</option>
</select>

<button type="submit"
style="width:100%; padding:14px; border:none; border-radius:30px; background: linear-gradient(45deg, #00f5ff, #8e2de2); font-weight:bold; color:white; cursor:pointer;">
Create Account
</button>

</form>

</div>
</div>
{% endblock %}
