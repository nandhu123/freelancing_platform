{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div style="max-width:450px; margin:50px auto; padding:30px; background:#f8f9fa; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">

    <h2 style="text-align:center; margin-bottom:25px; color:#0ea5e9;">Create Your Account</h2>

    {% if messages %}
        <ul style="color:red; list-style:none; padding:0; margin-bottom:15px;">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}

        <!-- Username -->
        <label for="username" style="display:block; margin-bottom:5px; font-weight:bold;">Username</label>
        <input type="text" name="username" id="username" placeholder="Enter username" required
               value="{{ username|default:'' }}"
               style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc;">

        <!-- Email -->
        <label for="email" style="display:block; margin-bottom:5px; font-weight:bold;">Email</label>
        <input type="email" name="email" id="email" placeholder="Enter email" required
               value="{{ email|default:'' }}"
               style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc;">

        <!-- Password -->
        <label for="password" style="display:block; margin-bottom:5px; font-weight:bold;">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter password" required
               style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc;">

        <!-- Role -->
        <label for="role" style="display:block; margin-bottom:5px; font-weight:bold;">Select Role</label>
        <select name="role" id="role" required
                style="width:100%; padding:10px; margin-bottom:20px; border-radius:5px; border:1px solid #ccc;">
            <option value="">-- Select Role --</option>
            <option value="client" {% if role == "client" %}selected{% endif %}>Client</option>
            <option value="freelancer" {% if role == "freelancer" %}selected{% endif %}>Freelancer</option>
        </select>

        <!-- Submit Button -->
        <button type="submit"
                style="width:100%; padding:12px; background:#0ea5e9; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">
            Create Account
        </button>

    </form>

    <p style="text-align:center; margin-top:20px;">
        Already have an account? 
        <a href="{% url 'login' %}" style="color:#0ea5e9; text-decoration:none;">Login here</a>
    </p>

</div>
{% endblock %}
