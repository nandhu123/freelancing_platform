{% extends "base.html" %}

{% block title %}Schedule Interview{% endblock %}

{% block content %}
<div style="margin-bottom:20px;">

<a href="{% url 'dashboard' %}" style="
text-decoration:none;
color:white;
font-size:18px;
padding:8px 12px;
border-radius:8px;
background:rgba(255,255,255,0.1);
">

⬅ 

</a>

</div>

<div style="
min-height:100vh;
background:linear-gradient(135deg,#1e1b4b,#312e81,#0f172a);
color:white;
padding:40px;
">

<a href="{% url 'recruiter_dashboard' %}" style="
text-decoration:none;
color:white;
font-size:18px;
padding:8px 12px;
border-radius:8px;
background:rgba(255,255,255,0.1);
">
⬅ Back
</a>

<h1 style="margin-top:30px;color:#40d4d9;">
🎤 Schedule Interview
</h1>

<p style="opacity:0.8;margin-bottom:30px;">
Schedule an interview for <strong>{{ application.freelancer.username }}</strong>
</p>

<div style="
max-width:500px;
padding:30px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
box-shadow:0 8px 25px rgba(0,255,255,0.2);
">

<form method="POST">

{% csrf_token %}

<label style="font-weight:600;">Interview Date & Time</label>
<br><br>

<input type="datetime-local" name="interview_date" required style="
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin-bottom:20px;
">

<label style="font-weight:600;">Meeting Link</label>
<br><br>

<input type="url" name="meeting_link" placeholder="Paste Google Meet / Zoom link" required style="
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin-bottom:25px;
">

<button type="submit" style="
padding:12px 25px;
border-radius:12px;
border:none;
background:linear-gradient(135deg,#06b6d4,#3b82f6);
color:white;
font-weight:600;
cursor:pointer;
">
Schedule Interview
</button>

</form>

</div>

</div>

{% endblock %}
