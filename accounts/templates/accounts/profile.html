{% extends "base.html" %}
{% block title %}Profile Setup{% endblock %}

{% block content %}

<style>

body{
background:linear-gradient(135deg,#12002f,#020617,#0f172a);
min-height:100vh;
}

.profile-wrapper{
display:flex;
justify-content:center;
align-items:center;
min-height:85vh;
}

.profile-card{
width:420px;
padding:40px;
border-radius:18px;
background:#1e1b4b;
box-shadow:0 0 40px rgba(0,255,255,0.25);
}

.profile-card h2{
text-align:center;
color:#22d3ee;
margin-bottom:30px;
font-size:28px;
letter-spacing:1px;
}

.profile-card label{
display:block;
margin-bottom:6px;
opacity:0.8;
}

.profile-card input,
.profile-card select{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#312e81;
color:white;
margin-bottom:20px;
}

.profile-card input:focus,
.profile-card select:focus{
outline:none;
box-shadow:0 0 10px #22d3ee;
}

.save-btn{
width:100%;
padding:14px;
border:none;
border-radius:25px;
background:linear-gradient(90deg,#22d3ee,#9333ea);
color:white;
font-weight:600;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

.save-btn:hover{
transform:scale(1.03);
box-shadow:0 0 15px rgba(147,51,234,0.6);
}

</style>

<div class="profile-wrapper">

<div class="profile-card">

<h2>Profile Setup</h2>

<form method="POST">
{% csrf_token %}

<label>Username</label> <input type="text" name="username" value="{{ request.user.username }}">

<label>Email</label> <input type="email" name="email" value="{{ request.user.email }}">

<label>Choose Your Role</label> <select name="role">

<option value="freelancer"
{% if profile.role == "freelancer" %}selected{% endif %}>
Freelancer
</option>

<option value="client"
{% if profile.role == "client" %}selected{% endif %}>
Client
</option>

</select>

<button type="submit" class="save-btn">
Save & Continue
</button>

</form>

</div>

</div>

{% endblock %}
