{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div style="max-width:400px; margin:50px auto; padding:20px; background:#1e293b; border-radius:10px; color:white; text-align:center;">
    <h2>Login</h2>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required style="width:100%; padding:10px; margin:10px 0;">
        <input type="password" name="password" placeholder="Password" required style="width:100%; padding:10px; margin:10px 0;">
        <button type="submit" style="width:100%; padding:10px; margin-top:10px; background:#0ea5e9; border:none; border-radius:5px; cursor:pointer;">Login</button>
    </form>

    <p style="margin-top:20px;">
        Don’t have an account?
        <a href="{% url 'register' %}" style="color:#22d3ee;">Register</a>
    </p>
</div>
{% endblock %}
